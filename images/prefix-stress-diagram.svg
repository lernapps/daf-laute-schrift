<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-label="Peter's Sound-Spelling Board: Separable verbs stress the prefix (AUF-stehen, AN-rufen) while inseparable verbs stress the stem (ver-STEH-en, er-ZÄH-len)">
  <rect width="340" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sound-Spelling Board · Verb-Prefix Stress</text>

  <rect x="16" y="38" width="308" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="28" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">SEPARABLE → Stress on the PREFIX (splits!)</text>
  <rect x="28" y="66" width="50" height="26" rx="5" fill="#1d4ed8"/>
  <text x="53" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AUF</text>
  <text x="86" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1e3a8a">-stehen</text>
  <rect x="154" y="66" width="40" height="26" rx="5" fill="#1d4ed8"/>
  <text x="174" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AN</text>
  <text x="202" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1e3a8a">-rufen</text>

  <rect x="16" y="116" width="308" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="28" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">INSEPARABLE → Stress on the STEM (stays joined)</text>
  <text x="28" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78350f">ver-</text>
  <rect x="56" y="144" width="54" height="26" rx="5" fill="#b45309"/>
  <text x="83" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">STEH</text>
  <text x="114" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78350f">-en</text>

  <text x="158" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78350f">er-</text>
  <rect x="178" y="144" width="54" height="26" rx="5" fill="#b45309"/>
  <text x="205" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ZÄH</text>
  <text x="236" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#78350f">-len</text>
</svg>
