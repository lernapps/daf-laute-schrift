<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 226" role="img" aria-label="Peter's Sound-Spelling Board: long vowel signals (ie, silent h, double vowel) versus short vowel signals (double consonant, ck, tz)">
  <rect width="340" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sound-Spelling Board · Long vs. Short Vowels</text>

  <rect x="16" y="38" width="148" height="150" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="90" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">LONG (stretched)</text>
  <line x1="28" y1="66" x2="152" y2="66" stroke="#93c5fd" stroke-width="1.2"/>

  <text x="28" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">ie</text>
  <text x="58" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">Biene · Miete</text>

  <text x="28" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">silent h</text>
  <text x="78" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">Fahrrad · Uhr</text>

  <text x="28" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">aa/ee/oo</text>
  <text x="86" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">Boot · Kaffee</text>

  <text x="28" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e3a8a">Also 1 consonant: Tag</text>

  <rect x="176" y="38" width="148" height="150" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">SHORT (snappy)</text>
  <line x1="188" y1="66" x2="312" y2="66" stroke="#fcd34d" stroke-width="1.2"/>

  <text x="188" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">tt / nn</text>
  <text x="234" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">Bett · Mitte</text>

  <text x="188" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">ck (= kk)</text>
  <text x="246" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">Zucker · Jacke</text>

  <text x="188" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">tz (= zz)</text>
  <text x="246" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">Platz · Katze</text>

  <text x="188" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350f">2 letters stop the vowel</text>
</svg>
