# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: "Schreibung von s, ss und ß"
  en: "Spelling s, ss, and ß"
description:
  de: "Anhand von Stimmhaftigkeit und Vokallänge sicher entscheiden, ob ein Wort mit s, ss oder ß geschrieben wird."
  en: "Decide reliably between s, ss, and ß using voicing and the vowel-length test."
competencies: [s-laute-ss-sz]
blocks:
  - type: section
    id: einstieg
    title:
      de: "Straße, Wasser, Sonne: Der Vokallängen-Test für ss und ß"
      en: "Straße, Wasser, Sonne: The Vowel-Length Test for ss vs. ß"
    blocks:
      - type: text
        text:
          de: "Auf dem Lindenberger Stadtplan entdeckt Sam **Schlossstraße** und **Wasserplatz** – mal **ss**, mal **ß**! Herr Braun zeigt das klare Entscheidungsschema auf der **Laut-Schrift-Tafel**: Erst hörst du, ob das *s* weich summt oder scharf zischt – und beim scharfen *s* entscheidet die **Vokallänge**."
          en: "On the Lindenberg town map, Sam spots **Schlossstraße** and **Wasserplatz** — sometimes **ss**, sometimes **ß**! Herr Braun puts the clear decision rule on the **Sound-Spelling Board**: first check whether *s* buzzes (voiced) or hisses (voiceless) — and for the sharp hissing *s*, **vowel length** decides."
      - type: table
        caption:
          de: "Entscheidungstafel für s, ss und ß"
          en: "Decision board for s, ss, and ß"
        header:
          - { de: "Schreibung", en: "Spelling" }
          - { de: "Regel", en: "Rule" }
          - { de: "Beispiele", en: "Examples" }
        rows:
          - - { de: "**s** (weich / summend)", en: "**s** (voiced / buzzing)" }
            - {
                de: "vor Vokal am Wort- oder Silbenanfang (wie Englisch *z* in *zoo*)",
                en: "before a vowel at word/syllable start (like English *z* in *zoo*)",
              }
            - { de: "**S**onne, **S**am, le**s**en, Rei**s**e", en: "**S**onne, **S**am, le**s**en, Rei**s**e" }
          - - { de: "**ss** (scharf / zischend)", en: "**ss** (sharp / hissing)" }
            - { de: "nach **kurzem** Vokal", en: "after a **short** vowel" }
            - {
                de: "Wa**ss**er, Kla**ss**e, e**ss**en, Flu**ss**, mu**ss**",
                en: "Wa**ss**er, Kla**ss**e, e**ss**en, Flu**ss**, mu**ss**",
              }
          - - { de: "**ß** (scharf / zischend)", en: "**ß** (sharp / hissing)" }
            - {
                de: "nach **langem** Vokal oder **Diphthong** (*ei, au, eu*)",
                en: "after a **long** vowel or **diphthong** (*ei, au, eu*)",
              }
            - {
                de: "Stra**ß**e, Fu**ß**, gro**ß**, hei**ß**en, drau**ß**en",
                en: "Stra**ß**e, Fu**ß**, gro**ß**, hei**ß**en, drau**ß**en",
              }
      - type: note
        title:
          de: "Wichtig für das Standarddeutsche"
          en: "Standard German note"
        blocks:
          - type: text
            text:
              de: "Am Wortende (*Haus, Eis*) klingt ein einfaches **s** durch die Auslautverhärtung auch scharf, bleibt aber einfaches **s** (Verlängerung: *Häu**s**er*, weiches *s*). Und **ß** steht nie am Wortanfang!"
              en: "At the end of a word (*Haus, Eis*), a single **s** also sounds sharp due to final devoicing, yet stays single **s** (extended: *Häu**s**er*, voiced *s*). And **ß** never starts a word!"

  - type: section
    id: uebung
    title:
      de: "Übung: s, ss oder ß?"
      en: "Practice: s, ss, or ß?"
    blocks:
      - type: language-task
        id: ss-oder-sz-waehlen
        languages: { source: en, target: de }
        mode: choice
        task:
          de: "Entscheide nach der Vokallänge: **ss** (kurzer Vokal) oder **ß** (langer Vokal / Diphthong)?"
          en: "Decide by vowel length: **ss** (short vowel) or **ß** (long vowel / diphthong)?"
        items:
          - source: "street (long a)"
            target: "Stra[ß]e"
            distractors: [["ss"]]
          - source: "water (short a)"
            target: "Wa[ss]er"
            distractors: [["ß"]]
          - source: "to be called (diphthong ei)"
            target: "hei[ß]en"
            distractors: [["ss"]]
          - source: "river (short u)"
            target: "Flu[ss]"
            distractors: [["ß"]]
        explanation:
          de: "Langer Vokal oder Diphthong → **ß** (*Straße, heißen*); kurzer Vokal → **ss** (*Wasser, Fluss*)."
          en: "Long vowel or diphthong → **ß** (*Straße, heißen*); short vowel → **ss** (*Wasser, Fluss*)."
      - type: single-choice
        id: dass-vs-das
        text:
          de: "Warum schreibt man **groß** mit **ß**, aber **Klasse** mit **ss**?"
          en: "Why is **groß** spelled with **ß**, while **Klasse** is spelled with **ss**?"
        options:
          - text:
              de: "In *groß* ist das *o* lang, in *Klasse* ist das *a* kurz."
              en: "In *groß* the *o* is long; in *Klasse* the *a* is short."
            correct: true
            info:
              de: "Genau! Der scharfe s-Laut folgt bei langem Vokal der Schreibung **ß**, bei kurzem Vokal **ss**."
              en: "Exactly! A sharp voiceless s is spelled **ß** after a long vowel and **ss** after a short vowel."
          - text:
              de: "Am Wortende steht immer **ß**, in der Wortmitte immer **ss**."
              en: "**ß** always goes at the end of a word and **ss** always in the middle."
            correct: false
            info:
              de: "Gegenbeispiel: *Fluss* und *muss* enden auf **ss** (kurzer Vokal), während *Straße* in der Mitte **ß** hat (langes *a*)."
              en: "Counterexample: *Fluss* and *muss* end in **ss** (short vowel), while *Straße* has **ß** in the middle (long *a*)."
          - text:
              de: "Nomen haben immer **ss**, Adjektive immer **ß**."
              en: "Nouns always use **ss**, adjectives always use **ß**."
            correct: false
            info:
              de: "Die Wortart spielt keine Rolle – *Straße* und *Fuß* sind Nomen mit **ß**, *nass* ist ein Adjektiv mit **ss**."
              en: "Part of speech does not matter — *Straße* and *Fuß* are nouns with **ß**, and *nass* is an adjective with **ss**."
        explanation:
          de: "Die Regel für **ss** gegen **ß** hängt allein von der Länge des Vokals davor ab."
          en: "The choice between **ss** and **ß** depends solely on the length of the preceding vowel."
