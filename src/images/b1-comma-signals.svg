<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" role="img" aria-label="Peter's Sound-Spelling Board: B1 comma signals for embedded relative clauses (two commas) and infinitive clauses with um/ohne/statt zu or nouns like Lust">
  <rect width="340" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sound-Spelling Board · B1 Comma Signals</text>

  <rect x="16" y="38" width="308" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">1. Embedded relative clause → TWO commas</text>
  <text x="26" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Der Lehrer</text>
  <text x="84" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#be123c">,</text>
  <text x="92" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">der uns hilft</text>
  <text x="157" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#be123c">,</text>
  <text x="165" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">heißt Herr Braun.</text>

  <rect x="16" y="98" width="308" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="26" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">2. um / ohne / (an)statt … zu → ALWAYS comma</text>
  <text x="26" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Peter übt täglich</text>
  <text x="115" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#be123c">,</text>
  <text x="123" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">um klarer zu sprechen.</text>

  <rect x="16" y="150" width="308" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="26" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">3. After noun / hint word (Lust, Plan, es)</text>
  <text x="26" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Er hat Lust</text>
  <text x="86" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#be123c">,</text>
  <text x="94" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">einen Blog zu schreiben.</text>
</svg>
