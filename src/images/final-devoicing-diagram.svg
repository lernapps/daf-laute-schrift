<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 228" role="img" aria-label="Peter's Sound-Spelling Board: Final devoicing b to p, d to t, g to k at word end, checked with the extension test">
  <rect width="340" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sound-Spelling Board · Final Devoicing</text>

  <text x="58" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Word end (hard)</text>
  <text x="240" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Extend (+e / +er)</text>

  <rect x="16" y="54" width="118" height="36" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/>
  <text x="75" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">b → [p]  halb</text>
  <text x="148" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">→</text>
  <rect x="164" y="54" width="160" height="36" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="244" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">hal·be (soft b!)</text>

  <rect x="16" y="98" width="118" height="36" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/>
  <text x="75" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">d → [t]  Kind</text>
  <text x="148" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">→</text>
  <rect x="164" y="98" width="160" height="36" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="244" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Kin·der (soft d!)</text>

  <rect x="16" y="142" width="118" height="36" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/>
  <text x="75" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9f1239">g → [k]  Tag</text>
  <text x="148" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">→</text>
  <rect x="164" y="142" width="160" height="36" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="244" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Ta·ge (soft g!)</text>

  <text x="16" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">Tip: Make it longer to hear the true letter.</text>
</svg>
