<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-label="Peter's Sound-Spelling Board: Decision rule for s, ss, and ß based on buzzing versus hissing and vowel length">
  <rect width="340" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sound-Spelling Board · s, ss, or ß?</text>

  <rect x="16" y="38" width="308" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="28" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532d">s</text>
  <text x="56" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#14532d">Soft buzzing sound (like zoo)</text>
  <text x="56" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#14532d">Sonne · lesen · Reise</text>

  <rect x="16" y="90" width="308" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="28" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">ss</text>
  <text x="56" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Sharp hiss + SHORT vowel</text>
  <text x="56" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#78350f">essen · nass · muss</text>

  <rect x="16" y="142" width="308" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="28" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">ß</text>
  <text x="56" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Sharp hiss + LONG vowel or glide</text>
  <text x="56" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e3a8a">Fuß · draußen · Gruß</text>
</svg>
