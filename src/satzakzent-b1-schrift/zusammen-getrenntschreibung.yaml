# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: "Zusammenschreibung und Nominalisierung"
  en: "Compounds and Nominalizations"
description:
  de: "Zusammengesetzte deutsche Nomen richtig zusammenschreiben und nominalisierte Verben und Adjektive (beim Lesen, alles Gute) großschreiben."
  en: "Write German compound nouns as single words and capitalize nominalized verbs and adjectives (beim Lesen, alles Gute)."
competencies: [zusammen-getrenntschreibung]
blocks:
  - type: section
    id: einstieg
    title:
      de: "Letzter Schliff für den Blog: Keine Lücken in Komposita!"
      en: "Final Polish for the Blog: No Gaps in Compound Nouns!"
    blocks:
      - type: text
        text:
          de: "Im Englischen stehen zusammengesetzte Begriffe oft getrennt (*school blog, bike path*). Im Deutschen schreibt man sie **als ein einziges Wort** (*Schulblog, Fahrradweg*) – und wenn ein Verb oder Adjektiv wie ein Nomen gebraucht wird, trägt es auf Peters **Laut-Schrift-Tafel** ein großes Signal!"
          en: "In English, compound nouns are often written with spaces (*school blog, bike path*). In German, you write them **as one single word** (*Schulblog, Fahrradweg*) — and whenever a verb or adjective is used as a noun, it earns a capital letter on Peter's **Sound-Spelling Board**!"
      - type: single-choice
        id: kompositum-richtig
        text:
          de: "Welche Schreibweise ist im Standarddeutschen richtig?"
          en: "Which spelling is correct in Standard German?"
        options:
          - text:
              {
                de: "Peter bereitet sich auf die B1-Prüfung im Jugendzentrum vor.",
                en: "Peter bereitet sich auf die B1-Prüfung im Jugendzentrum vor.",
              }
            correct: true
            info:
              de: "Richtig! *Jugendzentrum* wird als normales Kompositum zusammengeschrieben, *B1-Prüfung* bekommt wegen der Ziffer/Abkürzung einen Bindestrich."
              en: "Correct! *Jugendzentrum* is written as one word, while *B1-Prüfung* uses a hyphen because of the code/digit."
          - text:
              {
                de: "Peter bereitet sich auf die B1 Prüfung im Jugend Zentrum vor.",
                en: "Peter bereitet sich auf die B1 Prüfung im Jugend Zentrum vor.",
              }
            correct: false
            info:
              de: "Im Deutschen werden Nomen-Komposita nicht mit Leerzeichen getrennt (*Jugendzentrum*, *B1-Prüfung*)."
              en: "German does not separate compound nouns with spaces (*Jugendzentrum*, *B1-Prüfung*)."
          - text:
              {
                de: "Peter bereitet sich auf die B1Prüfung im jugendzentrum vor.",
                en: "Peter bereitet sich auf die B1Prüfung im jugendzentrum vor.",
              }
            correct: false
            info:
              de: "Nomen (*Jugendzentrum*) sind immer groß, und Zusammensetzungen mit *B1* brauchen einen Bindestrich (*B1-Prüfung*)."
              en: "Nouns (*Jugendzentrum*) are always capitalized, and compounds with *B1* require a hyphen (*B1-Prüfung*)."
        explanation:
          de: "Zusammengesetzte Nomen stehen ohne Leerzeichen als ein Wort – nur bei einzelnen Buchstaben, Abkürzungen oder Ziffern (*B1-Prüfung, E-Mail*) steht ein Bindestrich."
          en: "Compound nouns are written as a single word with no spaces — only single letters, abbreviations, or digits (*B1-Prüfung, E-Mail*) take a hyphen."

  - type: section
    id: tafel
    title:
      de: "Zusammenschreibung und Nominalisierung auf einen Blick"
      en: "Compounds and Nominalizations at a Glance"
    blocks:
      - type: table
        caption:
          de: "Zusammenschreibung und Nominalisierung auf einen Blick"
          en: "Compounds and nominalizations at a glance"
        header:
          - { de: "Bereich", en: "Area" }
          - { de: "Regel & Signalwörter", en: "Rule & signal words" }
          - { de: "Beispiele", en: "Examples" }
        rows:
          - - { de: "**Nomen-Komposita**", en: "**Compound nouns**" }
            - {
                de: "immer **zusammen** (Bindestrich nur bei Abkürzungen/Ziffern)",
                en: "always **one word** (hyphen only with abbreviations/digits)",
              }
            - {
                de: "Sportverein, Schulblog, Sommerferien, **B1-Prüfung**",
                en: "Sportverein, Schulblog, Sommerferien, **B1-Prüfung**",
              }
          - - { de: "**Nominalisierte Verben**", en: "**Nominalized verbs**" }
            - {
                de: "groß nach Artikel oder Präposition (*das, beim, zum, vom*)",
                en: "capitalized after an article or preposition (*das, beim, zum, vom*)",
              }
            - {
                de: "**das Lesen**, **beim Lernen**, **zum Schwimmen**",
                en: "**das Lesen**, **beim Lernen**, **zum Schwimmen**",
              }
          - - { de: "**Nominalisierte Adjektive**", en: "**Nominalized adjectives**" }
            - {
                de: "groß nach *etwas, nichts, alles, viel, wenig*",
                en: "capitalized after *etwas, nichts, alles, viel, wenig*",
              }
            - {
                de: "etwas **Gutes**, alles **Liebe**, nichts **Neues**",
                en: "etwas **Gutes**, alles **Liebe**, nichts **Neues**",
              }
      - type: note
        title:
          de: "Verben bleiben meist getrennt"
          en: "Two verbs or noun + verb stay separate"
        blocks:
          - type: text
            text:
              de: "Während Nomen-Komposita zusammengeschrieben werden (*das Fahrradfahren*), bleiben Verbverbindungen wie *Rad fahren*, *Fußball spielen* oder *spazieren gehen* im Infinitiv getrennt."
              en: "While compound nouns are written as one word (*das Fahrradfahren*), verb phrases like *Rad fahren*, *Fußball spielen*, and *spazieren gehen* stay separate."

  - type: section
    id: uebung
    title:
      de: "Übung: Zusammenschreibung & Nominalisierung"
      en: "Practice: Compounds & Nominalizations"
    blocks:
      - type: language-task
        id: nominalisierung-gross
        languages: { source: en, target: de }
        mode: choice
        task:
          de: "Wähle die richtige Schreibweise für Peters Abschlussbeitrag im Lindenberger Schulblog."
          en: "Choose the right spelling for Peter's final post on the Lindenberg school blog."
        items:
          - source: "I wish you all the best!"
            target: "Ich wünsche euch alles [Gute]!"
            distractors: [["gute"]]
          - source: "While reading, I learn new words."
            target: "Beim [Lesen] lerne ich viele [neue] Wörter."
            distractors: [["lesen"], ["Neue"]]
          - source: "Did anything exciting happen at the youth center?"
            target: "Ist im [Jugendzentrum] etwas [Spannendes] passiert?"
            distractors: [["Jugend Zentrum"], ["spannendes"]]
        explanation:
          de: "Nach *alles, etwas* und *beim* werden Adjektive und Verben zu Nomen (*alles Gute, beim Lesen, etwas Spannendes*). Steht ein Adjektiv aber vor einem Nomen (*viele neue Wörter*), bleibt es klein. Komposita wie *Jugendzentrum* schreibt man zusammen."
          en: "After *alles, etwas*, and *beim*, adjectives and verbs turn into nouns (*alles Gute, beim Lesen, etwas Spannendes*). Before a noun (*viele neue Wörter*), an adjective stays lowercase. Compound nouns like *Jugendzentrum* are always one word."
      - type: matching
        id: zusammen-getrennt-zuordnen
        text:
          de: "Ordne jeden Ausdruck der passenden Rechtschreibregel auf Peters Tafel zu."
          en: "Match each expression to its spelling rule on Peter's board."
        pairs:
          - left: { de: "Sommerferien", en: "Sommerferien" }
            right: { de: "Nomen-Kompositum → ein Wort ohne Leerzeichen", en: "compound noun → one word, no spaces" }
          - left: { de: "E-Mail", en: "E-Mail" }
            right: { de: "Einzelbuchstabe + Nomen → mit Bindestrich", en: "single letter + noun → with hyphen" }
          - left: { de: "beim Lernen", en: "beim Lernen" }
            right: { de: "nominalisiertes Verb nach beim → groß", en: "nominalized verb after beim → capitalized" }
          - left: { de: "Fußball spielen", en: "Fußball spielen" }
            right: { de: "Nomen + Verb im Infinitiv → getrennt", en: "noun + verb in infinitive → separate" }
        explanation:
          de: "Nomen-Komposita zusammen (*Sommerferien*), Einzelbuchstaben/Ziffern mit Bindestrich (*E-Mail*), nominalisierte Verben groß (*beim Lernen*) und Verbverbindungen getrennt (*Fußball spielen*)."
          en: "Compound nouns together (*Sommerferien*), single letters/digits hyphenated (*E-Mail*), nominalized verbs capitalized (*beim Lernen*), and verb phrases separate (*Fußball spielen*)."
      - type: language-task
        id: nominalisierung-tippen
        languages: { source: en, target: de }
        mode: gap
        form: { case: wrong, punctuation: ok }
        task:
          de: "Tippe die fehlenden Wörter mit der genauen Groß- oder Kleinschreibung ein."
          en: "Type the missing words with the exact right capitalization."
        items:
          - source: "There is nothing new (Neues) in the blog."
            target: "Im Blog gibt es nichts [Neues]."
            mistakes:
              - answer: "neues"
                message:
                  de: "Nach dem Signalwort *nichts* wird das Adjektiv großgeschrieben: *nichts Neues*."
                  en: "After the signal word *nichts*, the adjective is capitalized: *nichts Neues*."
          - source: "While writing (Schreiben), Nadia checks the commas."
            target: "Beim [Schreiben] prüft Nadia die Kommas."
            mistakes:
              - answer: "schreiben"
                message:
                  de: "Nach *beim* (= *bei dem*) wird das Verb zu einem Nomen: *beim Schreiben*."
                  en: "After *beim* (= *bei dem*), the verb becomes a noun: *beim Schreiben*."
          - source: "Peter buys a new (neues) notebook."
            target: "Peter kauft ein [neues] Heft."
            mistakes:
              - answer: "Neues"
                message:
                  de: "Hier steht *neues* als normales Adjektiv direkt vor dem Nomen *Heft* – also klein!"
                  en: "Here *neues* is a regular adjective right before the noun *Heft* — so keep it lowercase!"
        explanation:
          de: "Signalwörter wie *nichts, etwas, alles* und *beim* machen Adjektive/Verben groß (*nichts Neues, beim Schreiben*); vor einem Nomen bleibt das Adjektiv klein (*ein neues Heft*)."
          en: "Signal words like *nichts, etwas, alles*, and *beim* capitalize adjectives/verbs (*nichts Neues, beim Schreiben*); before a noun, the adjective stays lowercase (*ein neues Heft*)."
