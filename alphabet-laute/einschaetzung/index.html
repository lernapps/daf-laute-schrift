<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../alphabet-laute/">Alphabet, Umlaute und wichtige Konsonanten</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jeden deutschen Buchstaben seinem Klang beim Buchstabieren zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>V</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">weh (klingt wie englisches v)</option><option value="2">jott (klingt wie englisches y in yes)</option><option value="0">fau (klingt in deutschen Wörtern meist wie f)</option><option value="3">zett (klingt wie ts in cats)</option></select></label></li>
<li><label><span>W</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">weh (klingt wie englisches v)</option><option value="2">jott (klingt wie englisches y in yes)</option><option value="0">fau (klingt in deutschen Wörtern meist wie f)</option><option value="3">zett (klingt wie ts in cats)</option></select></label></li>
<li><label><span>J</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">weh (klingt wie englisches v)</option><option value="2">jott (klingt wie englisches y in yes)</option><option value="0">fau (klingt in deutschen Wörtern meist wie f)</option><option value="3">zett (klingt wie ts in cats)</option></select></label></li>
<li><label><span>Z</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">weh (klingt wie englisches v)</option><option value="2">jott (klingt wie englisches y in yes)</option><option value="0">fau (klingt in deutschen Wörtern meist wie f)</option><option value="3">zett (klingt wie ts in cats)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> V – fau (klingt in deutschen Wörtern meist wie f); W – weh (klingt wie englisches v); J – jott (klingt wie englisches y in yes); Z – zett (klingt wie ts in cats)</p>
<p class="question-explanation">Wer V (*fau*), W (*weh*), J (*jott*) und Z (*zett*) trennt, versteht deutsche Namen und Adressen beim ersten Hören.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Schreibe die Wörter auf, die Lukas Peter am Telefon auf Deutsch buchstabiert.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Wähle den passenden Laut (<strong>ei</strong>, <strong>ie</strong>, <strong>eu</strong>, <strong>äu</strong> oder <strong>au</strong>) für Peters Notizen aus Klasse 6.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedes Wort aus Peters Alltag in Lindenberg dem passenden Vokalklang zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Mai</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">langes i wie in see (ie)</option><option value="2">wie Englisch oy in boy (eu / äu)</option><option value="0">wie Englisch eye (ai / ei)</option><option value="3">wie Englisch ow in house (au)</option></select></label></li>
<li><label><span>Wien</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">langes i wie in see (ie)</option><option value="2">wie Englisch oy in boy (eu / äu)</option><option value="0">wie Englisch eye (ai / ei)</option><option value="3">wie Englisch ow in house (au)</option></select></label></li>
<li><label><span>Freund</span> <select name="frage-a4-2" data-left="2"><option value="">bitte wählen</option><option value="1">langes i wie in see (ie)</option><option value="2">wie Englisch oy in boy (eu / äu)</option><option value="0">wie Englisch eye (ai / ei)</option><option value="3">wie Englisch ow in house (au)</option></select></label></li>
<li><label><span>Braun</span> <select name="frage-a4-3" data-left="3"><option value="">bitte wählen</option><option value="1">langes i wie in see (ie)</option><option value="2">wie Englisch oy in boy (eu / äu)</option><option value="0">wie Englisch eye (ai / ei)</option><option value="3">wie Englisch ow in house (au)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Mai – wie Englisch eye (ai / ei); Wien – langes i wie in see (ie); Freund – wie Englisch oy in boy (eu / äu); Braun – wie Englisch ow in house (au)</p>
<p class="question-explanation">Mit diesen vier Klanggruppen (*ei/ai, ie, eu/äu, au*) liest du deutsche Vokalkombinationen auf einen Blick sicher vor.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welchen Wörtern spricht man **ch** als **Ach-Laut** (hinten im Rachen)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>Buch</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>Bücher</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>Woche</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>Milch</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Buch</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nach **u** folgt immer der Ach-Laut.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Bücher</strong></p><p>Durch den Umlaut **ü** wandert das **ch** nach vorn zum Ich-Laut!</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Woche</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nach **o** spricht man den Ach-Laut.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Milch</strong></p><p>Nach einem Konsonanten (*l*) steht immer der weiche Ich-Laut.</p></li>
</ul>
<p class="question-explanation">Merkhilfe: Nach **a, o, u, au** klingt **ch** hinten (Ach-Laut). Nach allen anderen Lauten – auch nach *ä, ö, ü* – klingt es vorn (Ich-Laut).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedes Wort aus Lindenberg dem passenden Konsonantenklang zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Stadtzentrum (St-)</span> <select name="frage-a6-0" data-left="0"><option value="">bitte wählen</option><option value="3">klingt wie schp- am Wortanfang</option><option value="2">klingt wie -st (kein sch am Wortende)</option><option value="1">klingt wie ts- (hart, wie in cats)</option><option value="0">klingt wie scht- am Wortanfang</option></select></label></li>
<li><label><span>Zug (Z-)</span> <select name="frage-a6-1" data-left="1"><option value="">bitte wählen</option><option value="3">klingt wie schp- am Wortanfang</option><option value="2">klingt wie -st (kein sch am Wortende)</option><option value="1">klingt wie ts- (hart, wie in cats)</option><option value="0">klingt wie scht- am Wortanfang</option></select></label></li>
<li><label><span>Fest (-st)</span> <select name="frage-a6-2" data-left="2"><option value="">bitte wählen</option><option value="3">klingt wie schp- am Wortanfang</option><option value="2">klingt wie -st (kein sch am Wortende)</option><option value="1">klingt wie ts- (hart, wie in cats)</option><option value="0">klingt wie scht- am Wortanfang</option></select></label></li>
<li><label><span>Sportverein (Sp-)</span> <select name="frage-a6-3" data-left="3"><option value="">bitte wählen</option><option value="3">klingt wie schp- am Wortanfang</option><option value="2">klingt wie -st (kein sch am Wortende)</option><option value="1">klingt wie ts- (hart, wie in cats)</option><option value="0">klingt wie scht- am Wortanfang</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Stadtzentrum (St-) – klingt wie scht- am Wortanfang; Zug (Z-) – klingt wie ts- (hart, wie in cats); Fest (-st) – klingt wie -st (kein sch am Wortende); Sportverein (Sp-) – klingt wie schp- am Wortanfang</p>
<p class="question-explanation">**sp/st** werden nur am Anfang eines Wortes oder Wortstamms zu *schp/scht*; am Wortende (*Fest*) bleibt das einfache *s*. **z** ist immer *ts*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
