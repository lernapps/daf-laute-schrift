<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Wann schreibt ihr den Deutschtest?</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">**MINA** hat die Kekse mitgebracht.</option><option value="0">Wir schreiben den Test am **DIENSTAG**.</option><option value="2">Nein, sie fährt mit dem **FAHRRAD**.</option></select></label></li>
<li><label><span>Wer hat die Kekse mitgebracht?</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">**MINA** hat die Kekse mitgebracht.</option><option value="0">Wir schreiben den Test am **DIENSTAG**.</option><option value="2">Nein, sie fährt mit dem **FAHRRAD**.</option></select></label></li>
<li><label><span>Fährt Frau Weber mit dem Auto zur Arbeit?</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">**MINA** hat die Kekse mitgebracht.</option><option value="0">Wir schreiben den Test am **DIENSTAG**.</option><option value="2">Nein, sie fährt mit dem **FAHRRAD**.</option></select></label></li>
