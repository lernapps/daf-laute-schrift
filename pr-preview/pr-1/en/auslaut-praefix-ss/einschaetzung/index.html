<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="explainer-language-text"><p>Use the extension test and choose the right final letter.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In which words is **r** **vocalized** (sounding like a short *a*) in Standard German?</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Wetter</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>hier</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>Reise</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>Vater</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wetter</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! The unstressed ending *-er* sounds like a short *-a*.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>hier</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After long *ie* at syllable end, **r** is vocalized (*hia*).</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Reise</strong></p><p>Here **R** starts the word before a vowel, so it is consonantal.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Vater</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! *-er* in *Vater* is vocalized too.</p></li>
</ul>
<p class="question-explanation">Vocalized **r** occurs mainly in *-er* endings (*Wetter, Vater*) and after a long vowel at syllable end (*hier, Uhr*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each verb to its stress and grammar pattern.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>aufmachen</span> <select name="frage-a3-0" data-left="0"><option value="">please choose</option><option value="3">ver-GES-sen (stem stressed, inseparable)</option><option value="0">AUF-machen (prefix stressed, separable)</option><option value="2">VOR-lesen (prefix stressed, separable)</option><option value="1">be-KOM-men (stem stressed, inseparable)</option></select></label></li>
<li><label><span>bekommen</span> <select name="frage-a3-1" data-left="1"><option value="">please choose</option><option value="3">ver-GES-sen (stem stressed, inseparable)</option><option value="0">AUF-machen (prefix stressed, separable)</option><option value="2">VOR-lesen (prefix stressed, separable)</option><option value="1">be-KOM-men (stem stressed, inseparable)</option></select></label></li>
<li><label><span>vorlesen</span> <select name="frage-a3-2" data-left="2"><option value="">please choose</option><option value="3">ver-GES-sen (stem stressed, inseparable)</option><option value="0">AUF-machen (prefix stressed, separable)</option><option value="2">VOR-lesen (prefix stressed, separable)</option><option value="1">be-KOM-men (stem stressed, inseparable)</option></select></label></li>
<li><label><span>vergessen</span> <select name="frage-a3-3" data-left="3"><option value="">please choose</option><option value="3">ver-GES-sen (stem stressed, inseparable)</option><option value="0">AUF-machen (prefix stressed, separable)</option><option value="2">VOR-lesen (prefix stressed, separable)</option><option value="1">be-KOM-men (stem stressed, inseparable)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> aufmachen – AUF-machen (prefix stressed, separable); bekommen – be-KOM-men (stem stressed, inseparable); vorlesen – VOR-lesen (prefix stressed, separable); vergessen – ver-GES-sen (stem stressed, inseparable)</p>
<p class="question-explanation">Prefixes like *auf-, vor-* are stressed and separable; *be-, ver-* are always unstressed and inseparable.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="explainer-language-text"><p>Type the full German word with the right <strong>ss</strong> or <strong>ß</strong> spelling.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In which sentences is a comma **required** at [ ]?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Peter nimmt die Deutsche Bahn [ ] weil sein Fahrrad kaputt ist.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Als Peter in Lindenberg ankam [ ] regnete es stark.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>Im Rucksack sind ein Heft [ ] und zwei Stifte.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>Ich wollte kommen [ ] aber ich hatte Training.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter nimmt die Deutsche Bahn [ ] weil sein Fahrrad kaputt ist.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! *weil* introduces a subordinate clause → comma required.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Als Peter in Lindenberg ankam [ ] regnete es stark.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After an initial subordinate clause, place a comma before the main-clause verb.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Im Rucksack sind ein Heft [ ] und zwei Stifte.</strong></p><p>In a simple list, do not put a comma before *und*.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Ich wollte kommen [ ] aber ich hatte Training.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Before the contrasting conjunction *aber*, German always requires a comma.</p></li>
</ul>
<p class="question-explanation">Commas separate subordinate clauses (*weil, dass, wenn, als*) from main clauses and precede *aber* — but not *und* in a list.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
