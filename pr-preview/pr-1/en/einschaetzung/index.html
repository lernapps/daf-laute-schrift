<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">

<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>Buch</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>Bücher</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>Woche</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>Milch</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Buch</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After **u**, **ch** is always the ach-sound.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Bücher</strong></p><p>Because of the umlaut **ü**, **ch** moves forward to the ich-sound!</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Woche</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After **o**, **ch** is the ach-sound.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Milch</strong></p><p>After a consonant (*l*), **ch** is always the soft ich-sound.</p></li>
</ul>
<p class="question-explanation">Rule of thumb: after **a, o, u, au**, **ch** is in the back (ach-sound). After every other sound — including *ä, ö, ü* — it is in the front (ich-sound).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>

<li><label><span>Fest (-st)</span> <select name="frage-a6-2" data-left="2"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>
<li><label><span>Sportverein (Sp-)</span> <select name="frage-a6-3" data-left="3"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>

</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>

<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Task 12</p><div class="question" id="frage-a12" data-id="a12" data-type="multiple-choice">

<label class="question-option"><input type="checkbox" name="frage-a12" value="1"> <span>Lindenberg</span></label>
<label class="question-option"><input type="checkbox" name="frage-a12" value="2"> <span>verstehen</span></label>

<div class="question-reveal" hidden>
<ul class="question-infos">

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Lindenberg</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! **LIN**-den-berg carries main stress on syllable 1.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>verstehen</strong></p><p>Here *ver-* is an unstressed prefix — the stem is stressed: ver-**STEH**-en.</p></li>

</ul>
<p class="question-explanation">Native German words and compounds almost always stress the first syllable — only unstressed prefixes like *ver-* shift stress onto the stem.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>

<li class="explainer-assessment-item" data-key="a14"><p class="explainer-assessment-label">Task 14</p><div class="question" id="frage-a14" data-id="a14" data-type="multiple-choice">

<label class="question-option"><input type="checkbox" name="frage-a14" value="1"> <span>hier</span></label>
<label class="question-option"><input type="checkbox" name="frage-a14" value="2"> <span>Reise</span></label>

<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wetter</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! The unstressed ending *-er* sounds like a short *-a*.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>hier</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After long *ie* at syllable end, **r** is vocalized (*hia*).</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Reise</strong></p><p>Here **R** starts the word before a vowel, so it is consonantal.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Vater</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! *-er* in *Vater* is vocalized too.</p></li>
</ul>
<p class="question-explanation">Vocalized **r** occurs mainly in *-er* endings (*Wetter, Vater*) and after a long vowel at syllable end (*hier, Uhr*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Als Peter in Lindenberg ankam [ ] regnete es stark.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After an initial subordinate clause, place a comma before the main-clause verb.</p></li>
