<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/vokallaenge-akzent/">Vowel Length, Word Stress and Capitalization</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 6 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>

<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each word from Peter's school day to its vowel-length signal.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Klasse</span> <select name="frage-a1-0" data-left="0"><option value="">please choose</option><option value="1">long e (silent h)</option><option value="2">long i (spelled ie)</option><option value="0">short a (double consonant ss)</option><option value="3">short ä (ck acts as double k)</option></select></label></li>
<li><label><span>Lehrer</span> <select name="frage-a1-1" data-left="1"><option value="">please choose</option><option value="1">long e (silent h)</option><option value="2">long i (spelled ie)</option><option value="0">short a (double consonant ss)</option><option value="3">short ä (ck acts as double k)</option></select></label></li>
<li><label><span>spielen</span> <select name="frage-a1-2" data-left="2"><option value="">please choose</option><option value="1">long e (silent h)</option><option value="2">long i (spelled ie)</option><option value="0">short a (double consonant ss)</option><option value="3">short ä (ck acts as double k)</option></select></label></li>
<li><label><span>Bäcker</span> <select name="frage-a1-3" data-left="3"><option value="">please choose</option><option value="1">long e (silent h)</option><option value="2">long i (spelled ie)</option><option value="0">short a (double consonant ss)</option><option value="3">short ä (ck acts as double k)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Klasse – short a (double consonant ss); Lehrer – long e (silent h); spielen – long i (spelled ie); Bäcker – short ä (ck acts as double k)</p>
<p class="question-explanation">On the Sound-Spelling Board, the core rule is: **ie / silent h / double vowel = long**, **double consonant / ck / tz = short**.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="explainer-language-text"><p>Choose the matching spelling signal for Peter&#39;s Lindenberg words.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="explainer-language-text"><p>Choose the correct capitalization for Peter&#39;s message to Herr Braun.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>

<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="explainer-language-text"><p>Type the missing words with the exact right capitalization.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each sentence from Peter's chat with Nadia to its ending intonation.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Hast du morgen Zeit?</span> <select name="frage-a5-0" data-left="0"><option value="">please choose</option><option value="2">falling (↘) – statement</option><option value="0">rising (↗) – yes/no question</option><option value="1">falling (↘) – neutral W-question</option></select></label></li>
<li><label><span>Wann beginnt der Unterricht?</span> <select name="frage-a5-1" data-left="1"><option value="">please choose</option><option value="2">falling (↘) – statement</option><option value="0">rising (↗) – yes/no question</option><option value="1">falling (↘) – neutral W-question</option></select></label></li>
<li><label><span>Die Schule beginnt um acht Uhr.</span> <select name="frage-a5-2" data-left="2"><option value="">please choose</option><option value="2">falling (↘) – statement</option><option value="0">rising (↗) – yes/no question</option><option value="1">falling (↘) – neutral W-question</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Hast du morgen Zeit? – rising (↗) – yes/no question; Wann beginnt der Unterricht? – falling (↘) – neutral W-question; Die Schule beginnt um acht Uhr. – falling (↘) – statement</p>
<p class="question-explanation">Statements and neutral W-questions end with falling intonation (↘). Yes/no questions end with clear rising intonation (↗).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In which words does the **first** syllable carry the main stress?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Schulhof</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Lindenberg</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>verstehen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>Brötchen</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Schulhof</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! **SCHUL**-hof stresses the first word of the compound.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Lindenberg</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! **LIN**-den-berg carries main stress on syllable 1.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>verstehen</strong></p><p>Here *ver-* is an unstressed prefix — the stem is stressed: ver-**STEH**-en.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Brötchen</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! **BRÖT**-chen stresses the stem syllable at the front.</p></li>
</ul>
<p class="question-explanation">Native German words and compounds almost always stress the first syllable — only unstressed prefixes like *ver-* shift stress onto the stem.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
