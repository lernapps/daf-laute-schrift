<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../vokallaenge-akzent/">Vokallänge, Wortakzent und Großschreibung</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedes Wort aus Peters Schultag dem passenden Vokallängen-Signal zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Klasse</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">langes e (stummes Dehnungs-h)</option><option value="2">langes i (Schreibung ie)</option><option value="0">kurzes a (Doppelkonsonant ss)</option><option value="3">kurzes ä (ck steht für doppeltes k)</option></select></label></li>
<li><label><span>Lehrer</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">langes e (stummes Dehnungs-h)</option><option value="2">langes i (Schreibung ie)</option><option value="0">kurzes a (Doppelkonsonant ss)</option><option value="3">kurzes ä (ck steht für doppeltes k)</option></select></label></li>
<li><label><span>spielen</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">langes e (stummes Dehnungs-h)</option><option value="2">langes i (Schreibung ie)</option><option value="0">kurzes a (Doppelkonsonant ss)</option><option value="3">kurzes ä (ck steht für doppeltes k)</option></select></label></li>
<li><label><span>Bäcker</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">langes e (stummes Dehnungs-h)</option><option value="2">langes i (Schreibung ie)</option><option value="0">kurzes a (Doppelkonsonant ss)</option><option value="3">kurzes ä (ck steht für doppeltes k)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Klasse – kurzes a (Doppelkonsonant ss); Lehrer – langes e (stummes Dehnungs-h); spielen – langes i (Schreibung ie); Bäcker – kurzes ä (ck steht für doppeltes k)</p>
<p class="question-explanation">Auf der Laut-Schrift-Tafel gilt die Faustregel: **ie / h / Doppelvokal = lang**, **Doppelkonsonant / ck / tz = kurz**.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Wähle das passende Schreibsignal für Peters Wörter aus Lindenberg.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Wähle die richtige Groß- oder Kleinschreibung für Peters Nachricht an Herr Braun.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Tippe die fehlenden Wörter mit der richtigen Groß- oder Kleinschreibung ein.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jeden Satz aus dem Gespräch mit Nadia der passenden Satzmelodie am Satzende zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Hast du morgen Zeit?</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="2">fallend (↘) – Aussagesatz</option><option value="0">steigend (↗) – Ja/Nein-Frage</option><option value="1">fallend (↘) – neutrale W-Frage</option></select></label></li>
<li><label><span>Wann beginnt der Unterricht?</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="2">fallend (↘) – Aussagesatz</option><option value="0">steigend (↗) – Ja/Nein-Frage</option><option value="1">fallend (↘) – neutrale W-Frage</option></select></label></li>
<li><label><span>Die Schule beginnt um acht Uhr.</span> <select name="frage-a5-2" data-left="2"><option value="">bitte wählen</option><option value="2">fallend (↘) – Aussagesatz</option><option value="0">steigend (↗) – Ja/Nein-Frage</option><option value="1">fallend (↘) – neutrale W-Frage</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Hast du morgen Zeit? – steigend (↗) – Ja/Nein-Frage; Wann beginnt der Unterricht? – fallend (↘) – neutrale W-Frage; Die Schule beginnt um acht Uhr. – fallend (↘) – Aussagesatz</p>
<p class="question-explanation">Aussagesätze und neutrale W-Fragen enden fallend (↘). Ja/Nein-Fragen enden klar steigend (↗).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welchen Wörtern trägt die **erste** Silbe den Hauptakzent?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Schulhof</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Lindenberg</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>verstehen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>Brötchen</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Schulhof</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! **SCHUL**-hof betont das erste Wort der Zusammensetzung.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Lindenberg</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! **LIN**-den-berg trägt den Hauptakzent auf Silbe 1.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>verstehen</strong></p><p>Hier ist *ver-* eine unbetonte Vorsilbe – betont wird der Stamm: ver-**STEH**-en.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Brötchen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! **BRÖT**-chen betont die Stammsilbe vorn.</p></li>
</ul>
<p class="question-explanation">Deutsche Grundwörter und Zusammensetzungen betonen fast immer die erste Silbe – nur unbetonte Vorsilben wie *ver-* lassen den Akzent auf den Stamm wandern.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
