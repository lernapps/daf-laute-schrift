<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../auslaut-praefix-ss/">Auslautverhärtung, Präfixakzent, ss/ß und erste Kommas</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Nutze die Verlängerungsprobe und wähle den richtigen Endbuchstaben.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welchen Wörtern wird das **r** im Standarddeutschen **vokalisiert** (klingt wie ein kurzes *a*)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Wetter</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>hier</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>Reise</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>Vater</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wetter</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Die unbetonte Endung *-er* klingt wie kurzes *-a*.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>hier</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nach langem *ie* am Silbenende wird **r** vokalisiert (*hia*).</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Reise</strong></p><p>Hier steht **R** am Anfang vor einem Vokal – also konsonantisch.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Vater</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Auch *-er* in *Vater* wird vokalisiert.</p></li>
</ul>
<p class="question-explanation">Vokalisiertes **r** hörst du vor allem in der Endung *-er* (*Wetter, Vater*) und nach langem Vokal am Silbenende (*hier, Uhr*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedes Verb dem passenden Betonungs- und Grammatikmuster zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>aufmachen</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">ver-GES-sen (Stamm betont, untrennbar)</option><option value="0">AUF-machen (Präfix betont, trennbar)</option><option value="2">VOR-lesen (Präfix betont, trennbar)</option><option value="1">be-KOM-men (Stamm betont, untrennbar)</option></select></label></li>
<li><label><span>bekommen</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">ver-GES-sen (Stamm betont, untrennbar)</option><option value="0">AUF-machen (Präfix betont, trennbar)</option><option value="2">VOR-lesen (Präfix betont, trennbar)</option><option value="1">be-KOM-men (Stamm betont, untrennbar)</option></select></label></li>
<li><label><span>vorlesen</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">ver-GES-sen (Stamm betont, untrennbar)</option><option value="0">AUF-machen (Präfix betont, trennbar)</option><option value="2">VOR-lesen (Präfix betont, trennbar)</option><option value="1">be-KOM-men (Stamm betont, untrennbar)</option></select></label></li>
<li><label><span>vergessen</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">ver-GES-sen (Stamm betont, untrennbar)</option><option value="0">AUF-machen (Präfix betont, trennbar)</option><option value="2">VOR-lesen (Präfix betont, trennbar)</option><option value="1">be-KOM-men (Stamm betont, untrennbar)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> aufmachen – AUF-machen (Präfix betont, trennbar); bekommen – be-KOM-men (Stamm betont, untrennbar); vorlesen – VOR-lesen (Präfix betont, trennbar); vergessen – ver-GES-sen (Stamm betont, untrennbar)</p>
<p class="question-explanation">Präfixe wie *auf-, vor-* sind betont und trennbar; *be-, ver-* sind immer unbetont und untrennbar.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Entscheide nach der Vokallänge: <strong>ss</strong> (kurzer Vokal) oder <strong>ß</strong> (langer Vokal / Diphthong)?</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-language-text"><p>Tippe das komplette Wort mit <strong>ss</strong> oder <strong>ß</strong> richtig ein.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welchen Sätzen **muss** an der Stelle [ ] ein Komma stehen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Peter nimmt die Deutsche Bahn [ ] weil sein Fahrrad kaputt ist.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Als Peter in Lindenberg ankam [ ] regnete es stark.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>Im Rucksack sind ein Heft [ ] und zwei Stifte.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>Ich wollte kommen [ ] aber ich hatte Training.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter nimmt die Deutsche Bahn [ ] weil sein Fahrrad kaputt ist.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! *weil* leitet einen Nebensatz ein → Komma ist Pflicht.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Als Peter in Lindenberg ankam [ ] regnete es stark.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nach einem vorangestellten Nebensatz steht das Komma vor dem Verb des Hauptsatzes.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Im Rucksack sind ein Heft [ ] und zwei Stifte.</strong></p><p>In einer einfachen Aufzählung steht vor *und* kein Komma.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Ich wollte kommen [ ] aber ich hatte Training.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Vor der entgegenstellenden Konjunktion *aber* steht im Deutschen immer ein Komma.</p></li>
</ul>
<p class="question-explanation">Kommas trennen Nebensätze (*weil, dass, wenn, als*) vom Hauptsatz und stehen vor *aber* – aber nicht vor *und* in einer Aufzählung.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
