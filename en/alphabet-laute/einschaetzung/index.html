<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/alphabet-laute/">Alphabet, Umlauts and Key Consonants</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 6 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>

<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each German letter to its sound when spelling aloud.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>V</span> <select name="frage-a1-0" data-left="0"><option value="">please choose</option><option value="1">veh (sounds like English v)</option><option value="2">yott (sounds like English y in yes)</option><option value="0">fow (usually sounds like f in German words)</option><option value="3">tsett (sounds like ts in cats)</option></select></label></li>
<li><label><span>W</span> <select name="frage-a1-1" data-left="1"><option value="">please choose</option><option value="1">veh (sounds like English v)</option><option value="2">yott (sounds like English y in yes)</option><option value="0">fow (usually sounds like f in German words)</option><option value="3">tsett (sounds like ts in cats)</option></select></label></li>
<li><label><span>J</span> <select name="frage-a1-2" data-left="2"><option value="">please choose</option><option value="1">veh (sounds like English v)</option><option value="2">yott (sounds like English y in yes)</option><option value="0">fow (usually sounds like f in German words)</option><option value="3">tsett (sounds like ts in cats)</option></select></label></li>
<li><label><span>Z</span> <select name="frage-a1-3" data-left="3"><option value="">please choose</option><option value="1">veh (sounds like English v)</option><option value="2">yott (sounds like English y in yes)</option><option value="0">fow (usually sounds like f in German words)</option><option value="3">tsett (sounds like ts in cats)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> V – fow (usually sounds like f in German words); W – veh (sounds like English v); J – yott (sounds like English y in yes); Z – tsett (sounds like ts in cats)</p>
<p class="question-explanation">Keeping V (*fow*), W (*veh*), J (*yott*), and Z (*tsett*) distinct helps you catch German names and addresses on the first try.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="explainer-language-text"><p>Type the words Lukas spells out to Peter over the phone using German letter names.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="explainer-language-text"><p>Choose the matching vowel spelling (<strong>ei</strong>, <strong>ie</strong>, <strong>eu</strong>, <strong>äu</strong>, or <strong>au</strong>) for Peter&#39;s Year 6 notes.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Next</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each word from Peter's day in Lindenberg to its vowel sound.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Mai</span> <select name="frage-a4-0" data-left="0"><option value="">please choose</option><option value="1">long ee as in see (ie)</option><option value="2">like English oy in boy (eu / äu)</option><option value="0">like English eye (ai / ei)</option><option value="3">like English ow in house (au)</option></select></label></li>
<li><label><span>Wien</span> <select name="frage-a4-1" data-left="1"><option value="">please choose</option><option value="1">long ee as in see (ie)</option><option value="2">like English oy in boy (eu / äu)</option><option value="0">like English eye (ai / ei)</option><option value="3">like English ow in house (au)</option></select></label></li>
<li><label><span>Freund</span> <select name="frage-a4-2" data-left="2"><option value="">please choose</option><option value="1">long ee as in see (ie)</option><option value="2">like English oy in boy (eu / äu)</option><option value="0">like English eye (ai / ei)</option><option value="3">like English ow in house (au)</option></select></label></li>
<li><label><span>Braun</span> <select name="frage-a4-3" data-left="3"><option value="">please choose</option><option value="1">long ee as in see (ie)</option><option value="2">like English oy in boy (eu / äu)</option><option value="0">like English eye (ai / ei)</option><option value="3">like English ow in house (au)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Mai – like English eye (ai / ei); Wien – long ee as in see (ie); Freund – like English oy in boy (eu / äu); Braun – like English ow in house (au)</p>
<p class="question-explanation">With these four sound groups (*ei/ai, ie, eu/äu, au*), you can read German vowel pairs aloud accurately at a glance.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In which words is **ch** pronounced as the **ach-sound** (back of the throat)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>Buch</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>Bücher</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>Woche</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>Milch</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Buch</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After **u**, **ch** is always the ach-sound.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Bücher</strong></p><p>Because of the umlaut **ü**, **ch** moves forward to the ich-sound!</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Woche</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! After **o**, **ch** is the ach-sound.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Milch</strong></p><p>After a consonant (*l*), **ch** is always the soft ich-sound.</p></li>
</ul>
<p class="question-explanation">Rule of thumb: after **a, o, u, au**, **ch** is in the back (ach-sound). After every other sound — including *ä, ö, ü* — it is in the front (ich-sound).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each Lindenberg word to its consonant sound.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Stadtzentrum (St-)</span> <select name="frage-a6-0" data-left="0"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>
<li><label><span>Zug (Z-)</span> <select name="frage-a6-1" data-left="1"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>
<li><label><span>Fest (-st)</span> <select name="frage-a6-2" data-left="2"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>
<li><label><span>Sportverein (Sp-)</span> <select name="frage-a6-3" data-left="3"><option value="">please choose</option><option value="3">sounds like shp- at the start of a word</option><option value="2">sounds like -st (no sh at word end)</option><option value="1">sounds like ts- (sharp, like in cats)</option><option value="0">sounds like sht- at the start of a word</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Stadtzentrum (St-) – sounds like sht- at the start of a word; Zug (Z-) – sounds like ts- (sharp, like in cats); Fest (-st) – sounds like -st (no sh at word end); Sportverein (Sp-) – sounds like shp- at the start of a word</p>
<p class="question-explanation">**sp/st** become *shp/sht* only at the start of a word or stem; at the end (*Fest*), plain *s* remains. **z** is always *ts*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
