<form class="question-form" novalidate>

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter geht in die Bibliothek [ ] um in Ruhe zu lernen.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Infinitive clauses with *um … zu* always take a comma.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Lukas ging los [ ] ohne seine Jacke mitzunehmen.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! *ohne … zu* and *(an)statt … zu* always require a comma.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Mina hat keine Zeit [ ] heute länger zu bleiben.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! The infinitive phrase depends on the noun *Zeit* → comma is mandatory.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Peter lernt [ ] Deutsch.</strong></p><p>This is a simple main clause with no subordinate or infinitive clause — no comma here.</p></li>
</ul>
<p class="question-explanation">Always use a comma before **um / ohne / (an)statt … zu** and before infinitive phrases depending on a noun (*Zeit, Lust, Plan*) or correlate (*es, daran*).</p>
